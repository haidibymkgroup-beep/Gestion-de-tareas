# Configuración local de Supabase (CLI). Para producción, estos valores
# se ajustan en el panel de tu proyecto (Authentication > URL Configuration).
project_id = "gestion-de-tareas"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Para activar Google en local, define estas variables de entorno antes de `supabase start`.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true
